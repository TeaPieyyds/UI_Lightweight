        if(s.mode==='data'&&s.data)content=`<img src="${s.data}">`;
        else if(s.mode==='url'&&s.url)content=`<img src="${esc(s.url)}">`;
        else{content=`<span style="font-size:44px;">${s.emoji||'🎞'}</span>`;bg=`background:${s.color||'#FFB4AB'};`;}
        return `<div class="slide ${i===cur?'':'hide'}" style="${bg}">${content}</div>`;
      }).join('');
      return `<div class="${cls('carousel')}" data-id="${p.id}" data-carousel="1" data-cur="${cur}" data-autoplay="${d.autoplay?1:0}" data-interval="${d.interval||3000}" style="${st}border-radius:${R(12)}">${slideHtml}<div class="nav prev" onclick="carouselPrev(event,'${p.id}')">‹</div><div class="nav next" onclick="carouselNext(event,'${p.id}')">›</div><div class="cnum">${cur+1}/${slides.length}</div><div class="dots">${slides.map((_,i)=>`<div class="dot ${i===cur?'on':''}" onclick="carouselGo(event,'${p.id}',${i})"></div>`).join('')}</div></div>`;
    }
    case 'pageview':{
      const pages=(d.pages&&d.pages.length)?d.pages:[];
      const cur=Math.min(d.cur||0,pages.length-1);
      const isEditing=!PV&&S.editingPage&&S.editingPage.pagerId===p.id;
      const pageHtml=pages.map((pg,i)=>{
        const parts=(pg.parts||[]);
        const emptyHint=(!PV&&!isEditing&&parts.length===0)?
          `<div class="pv-empty"><span class="big">📄</span><span>${esc(pg.name||'页面 '+(i+1))}</span><span style="font-size:10px;opacity:.6;">双击进入编辑</span></div>`:'';
        return `<div class="pv-page" data-pageidx="${i}" style="background:${pg.color||'#fff'};">
          ${emptyHint}
          ${parts.map(sp=>renderSubPart(sp,PV)).join('')}
        </div>`;
      }).join('');
      const dblAttr=PV?'':`ondblclick="enterPageEdit('${p.id}',${cur})"`;
      return `<div class="${cls('pageview')}" data-id="${p.id}"
        data-pageview="1" data-cur="${cur}"
        style="${st}border-radius:${R(12)}" ${dblAttr}>
        <div class="pv-track" style="transform:translateX(-${cur*100}%)">${pageHtml}</div>
      </div>`;
    }
    case 'video':{
      const cover=imgContent({imgMode:d.imgMode,emoji:d.emoji,url:d.url,data:d.data});
      return `<div class="${cls('video')}" data-id="${p.id}" style="${st}border-radius:${R(12)}"><div style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#666;font-size:36px;background:linear-gradient(135deg,#1a1a2e,#16213e);">${cover}</div><div class="play">▶</div><div class="bar"><div class="f"></div></div><div style="position:absolute;top:8px;left:10px;font-size:11px;background:rgba(0,0,0,.5);padding:2px 8px;border-radius:8px;">${esc(d.text||'视频')}</div></div>`;
    }
    case 'scrollpage':{
      const isEditing=!PV&&S.editingPage&&S.editingPage.pagerId===p.id;
      const inner=(d.parts||[]);
      const emptyHint=(!PV&&!isEditing&&inner.length===0)?
        `<div class="sp-empty"><span class="big">📜</span><span>滚动页面</span><span style="font-size:10px;opacity:.6;">双击进入编辑，可一直向下添加</span></div>`:'';
      const bg=d.color?`background:${d.color};`:'';
      const dblAttr=PV?'':`ondblclick="enterScrollEdit('${p.id}')"`;
      const contentH=Math.max(d.contentH||400,p.h);
      return `<div class="${cls('scrollpage sp-'+(d.style||'plain')+(PV?'':' editing-scroll'))}" data-id="${p.id}"
        data-scrollpage="1" style="${st}border-radius:${R(12)}" ${dblAttr}>
        <div class="sp-scroll" style="${bg}">
          <div class="sp-content" style="height:${contentH}px;">
            ${emptyHint}
            ${inner.map(sp=>renderSubPart(sp,PV)).join('')}
          </div>
        </div>
      </div>`;
    }
    case 'appbar':return `<div class="${cls('appbar')}" data-id="${p.id}" style="${st}"><span class="l">${d.icon||'←'}</span><span class="m" ${f('text')}>${esc(d.text||'页面标题')}</span><span class="r">⋮</span></div>`;
    case 'tabbar':return `<div class="${cls('tabbar')}" data-id="${p.id}" style="${st}">${(d.segments||[]).map((s,i)=>`<div class="${i===d.segIdx?'on':''}" ${PV?`onclick="pvSeg(event,'${p.id}',${i})"`:''}>${esc(s)}</div>`).join('')}</div>`;
    case 'bottom-nav':return `<div class="${cls('bnav')}" data-id="${p.id}" style="${st}">${(d.items||[]).map((it,i)=>`<div class="${i===d.segIdx?'on':''}" ${PV?`onclick="pvSeg(event,'${p.id}',${i})"`:''}><span class="bi">${it[0]}</span><span>${esc(it[1])}</span></div>`).join('')}</div>`;
    case 'container':return `<div class="${cls('cont')}" data-id="${p.id}" style="${st}border-radius:${R(12)}"></div>`;
    case 'timeline':return `<div class="${cls('timeline')}" data-id="${p.id}" style="${st}">${(d.items||[]).map(it=>`<div class="tl-item"><div class="tl-dot"></div><div class="tl-body"><b>${esc(it[0])}</b><span>${esc(it[1])}</span></div></div>`).join('')}</div>`;
    case 'dialog':return `<div class="${cls('dlg')}" data-id="${p.id}" style="${st}border-radius:${R(24)}"><h4 ${f('text')}>${esc(d.text||'对话框标题')}</h4><p ${f('sub')}>${esc(d.sub||'这里是对话框的内容说明。')}</p><div class="da"><button>取消</button><button>确定</button></div></div>`;
    case 'snackbar':{
      const c=BANNER_COLORS[d.colorIdx||0];
      return `<div class="${cls('snack')}" data-id="${p.id}" style="${st}background:${c.bg};color:${c.fg};border-radius:${R(6)}"><span ${f('text')}>${esc(d.text||'消息内容')}</span><span class="act" ${f('sub')} style="color:${c.bar}">${esc(d.sub||'撤销')}</span></div>`;
    }
    case 'navbar':{
      const sstyle=d.style||'pill';
      const items=d.items||[];
      const cur=Math.max(0,Math.min(items.length-1,d.cur||0));
      const pri=d.color||S.color||'#6750A4';
      // 是否当前屏就是这个导航栏的"归属屏"（可编辑）
      const home=navHomeScreen(p);
      const isHome=(S.cur===home)&&!PV;
      const editCls=isHome?' m3nav-edit':'';
      const inner=(withLabel)=>{
        const pillHtml=`<div class="m3nav-pill" style="width:${100/Math.max(1,items.length)}%;transform:translateX(${cur*100}%)"></div>`;
        return `<div class="m3nav-inner">${pillHtml}${items.map((it,i)=>`
          <button class="m3nav-item ${i===cur?'on':''}" data-idx="${i}"
            ${PV?`onclick="event.stopPropagation();navGo(event,'${p.id}',${i})"`:''}>
            <span class="m3nav-ico">${it.icon||'●'}</span>
            ${withLabel?`<span class="m3nav-lbl">${esc(it.label||'')}</span>`:''}
          </button>`).join('')}</div>`;
      };
      let bodyHtml='';
      if(sstyle==='bar'){
        const barInd=`<div class="m3nav-slide-ind" style="left:${((cur+0.5)/Math.max(1,items.length)*100).toFixed(4)}%"></div>`;
        bodyHtml=`<div class="m3nav-inner">${barInd}${items.map((it,i)=>`
          <button class="m3nav-item ${i===cur?'on':''}" data-idx="${i}"
            ${PV?`onclick="event.stopPropagation();navGo(event,'${p.id}',${i})"`:''}>
            <span class="m3nav-ico">${it.icon||'●'}</span>
            <span class="m3nav-lbl">${esc(it.label||'')}</span>
          </button>`).join('')}</div>`;
      }else if(sstyle==='floating'){
        bodyHtml=inner(false);
      }else{
        bodyHtml=inner(true);
      }
      const navCls='m3nav m3nav-'+sstyle+editCls;
      return `<div class="${cls('navbar-part')}" data-id="${p.id}" data-navbar="1" style="${base}">
        <div class="${navCls}" style="--nav-pri:${pri};position:absolute;inset:0;">${bodyHtml}</div>
      </div>`;
    }
    default:return '';
  }
}
function renderSubPart(sp,PV){
  return renderPart(sp,PV).replace('class="part ','class="part sub-part ');
}

/* ★ 连线层渲染（子页面编辑时隐藏） */
function updateLinkLayer(){
  const svg=document.getElementById('linkLayer');
  if(!svg)return;
  // 编辑子页面时不显示连线
  if(S.editingPage){svg.innerHTML='';return;}
  // 不显示连线的设置
  const mode=S.linkNoteMode||'full';
  if(mode==='hidden'){svg.innerHTML='';return;}
  const parts=getEditParts()||[];
  const pri=S.color||'#6750A4';
  const W=getCanvasSize().w,H=getCanvasSize().h;
  svg.setAttribute('viewBox',`0 0 ${W} ${H}`);
  svg.setAttribute('preserveAspectRatio','none');
  let html=`<defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto">
      <polygon points="0 0, 9 4, 0 8" fill="${pri}"/>
    </marker>
  </defs>`;
  (S.connections||[]).forEach(c=>{
    const from=parts.find(x=>x.id===c.from);
    const to=parts.find(x=>x.id===c.to);
    if(!from||!to)return;
    const x1=from.x+from.w/2,y1=from.y+from.h/2;
    const x2=to.x+to.w/2,y2=to.y+to.h/2;
    const dx=x2-x1,dy=y2-y1;
    const dist=Math.max(1,Math.sqrt(dx*dx+dy*dy));
    const mx=(x1+x2)/2,my=(y1+y2)/2;
    const offset=Math.min(dist*0.22,60);
    const nx=-dy/dist,ny2=dx/dist;
    const cx=mx+nx*offset,cy=my+ny2*offset;
    const dPath=`M${x1},${y1} Q${cx},${cy} ${x2},${y2}`;
    html+=`<path class="link-hit" d="${dPath}" onclick="editConnection('${c.id}')"></path>`;
    html+=`<path class="link-path" d="${dPath}" stroke="${pri}" marker-end="url(#arrowhead)"></path>`;
    if(c.note){
      const limit=S.linkNoteLimit||20;
      const disp=c.note.length>limit?c.note.slice(0,limit)+'…':c.note;
      const noteX=cx,noteY=cy;
      const textLen=Math.min(disp.length*6+12,140);
      html+=`<rect class="link-note-bg" x="${noteX-textLen/2}" y="${noteY-10}"
        width="${textLen}" height="18" rx="9"></rect>`;
      html+=`<text class="link-note" x="${noteX}" y="${noteY+3}"
        text-anchor="middle">${esc(disp)}</text>`;
    }
  });
  svg.innerHTML=html;
}

/* ★ 连线模式 */
function toggleLinkMode(){
  if(S.preview)return;
  S.linkMode=!S.linkMode;
  S.pendingLink=null;
  if(S.linkMode)clearAllSelection();
  document.getElementById('btnLink').classList.toggle('on',S.linkMode);
  document.getElementById('canvas').classList.toggle('linking',S.linkMode);
  document.querySelectorAll('.part').forEach(el=>el.classList.remove('link-pending'));
  document.getElementById('linkTip').classList.toggle('on',S.linkMode);
  updateLinkLayer();
}

function handleLinkClick(partId){
  const parts=getEditParts();if(!parts)return;
  if(!S.pendingLink){
    S.pendingLink=partId;
    document.querySelectorAll('.part').forEach(el=>{
      el.classList.toggle('link-pending',el.dataset.id===partId);
    });
    document.getElementById('linkTip').innerHTML=
      `起点已选：<b>${esc(getPartLabel(partId))}</b> · 点第二个部件完成连线`;
    return;
  }
  if(S.pendingLink===partId){
    S.pendingLink=null;
    document.querySelectorAll('.part').forEach(el=>el.classList.remove('link-pending'));
    document.getElementById('linkTip').innerHTML=
      `连线模式：点第一个部件 → 点第二个部件 → 写注释 · 再点 🔗 退出`;
    return;
  }
  const from=S.pendingLink,to=partId;
  const fromP=parts.find(x=>x.id===from);
  const toP=parts.find(x=>x.id===to);
  if(!fromP||!toP)return;
  const fromL=getPartLabel(from);
  const toL=getPartLabel(to);
  customPrompt(`连线：${fromL} → ${toL}`,
    '输入动作说明（预览模式下点击起点会执行）',
    `点${fromL}，${toL}出现；再点一次取消`).then(note=>{
    if(note===false){
      S.pendingLink=null;
      document.querySelectorAll('.part').forEach(el=>el.classList.remove('link-pending'));
      return;
    }
    const conn={
      id:uidc(),
      from,to,
      note:String(note||'').trim(),
      action:'toggle',
    };
    if(!S.connections)S.connections=[];
    S.connections.push(conn);
    S.pendingLink=null;
    document.querySelectorAll('.part').forEach(el=>el.classList.remove('link-pending'));
    document.getElementById('linkTip').innerHTML=
      `连线模式：点第一个部件 → 点第二个部件 → 写注释 · 再点 🔗 退出`;
    saveHist();
    updateLinkLayer();
    renderLayers();
  });
}

function getPartLabel(id){
  const parts=getEditParts()||[];
  const p=parts.find(x=>x.id===id);if(!p)return '?';
  const t=TYPES.find(x=>x.t===p.type)||{n:p.type};
  return p.text||p.icon||t.n;
}

function editConnection(id){
  const c=(S.connections||[]).find(x=>x.id===id);
  if(!c)return;
  const fromL=getPartLabel(c.from);
  const toL=getPartLabel(c.to);
  customPrompt(`编辑连接：${fromL} → ${toL}`,
    '输入注释（留空则删除该连接）',c.note||'').then(note=>{
    if(note===false)return;
    if(!String(note).trim()){
      S.connections=S.connections.filter(x=>x.id!==id);
    }else{
      c.note=String(note).trim();
    }
    saveHist();updateLinkLayer();renderLayers();
  });
}

function deleteConnection(id){
  S.connections=(S.connections||[]).filter(x=>x.id!==id);
  saveHist();updateLinkLayer();renderLayers();
}

function renderLayers(){
  const s=scr();const el=document.getElementById('layerList');
  const title=document.getElementById('layerTitle');
  if(!s){el.innerHTML='';return;}
  if(S.editingPage){
    const owner=byId(S.editingPage.pagerId);
    let parts=[],name='';
    if(owner&&owner.type==='fold-list'){
      const it=(owner.items||[])[S.editingPage.itemIdx];
      parts=it?.parts||[];name=it?.title||'列表项';
    }else if(owner&&owner.type==='scrollpage'){
      parts=owner.parts||[];name=(owner.text||'滚动页面');
    }else{
      const pg=(owner?.pages||[])[S.editingPage.pageIdx];
      parts=pg?.parts||[];name=pg?.name||'页面';
    }
    title.textContent=`图层 · ${name}`;
    if(!parts.length){
      const what=(owner?.type==='fold-list')?'列表项':(owner?.type==='scrollpage')?'滚动页面':'页面';
      el.innerHTML=`<div class="sb-empty">此${what}还没有组件<br><br>点右下角 ＋ 添加</div>`;
      return;
    }
    el.innerHTML=[...parts].reverse().map(p=>{
      const ti=TYPES.find(x=>x.t===p.type)||{i:'□',n:p.type};
      const label=p.text||p.icon||ti.n;
      return `<div class="litem ${p.id===S.sel?'on':''}" onclick="selectPart('${p.id}')">
        <span class="li2">${ti.i}</span>
        <span class="lname">${esc(label)}</span>
        <button class="lbtn" onclick="event.stopPropagation();moveLayerUp('${p.id}')">↑</button>
        <button class="lbtn" onclick="event.stopPropagation();moveLayerDown('${p.id}')">↓</button>
        <button class="lbtn ${p.locked?'on':''}" onclick="event.stopPropagation();toggleLock('${p.id}')\">${p.locked?'🔒':'🔓'}</button>
      </div>`;
    }).join('');
    return;
  }
  title.textContent='图层';
  const parts=s.parts;
  let html=[...parts].reverse().map(p=>{
    const ti=TYPES.find(x=>x.t===p.type)||{i:'□',n:p.type};
    const label=p.text||p.icon||ti.n;
    const isPV=p.type==='pageview';
    const isSP=p.type==='scrollpage';
    const expanded=(isPV||isSP)&&S.layerExpanded.has(p.id);
    let h=`<div class="litem ${p.id===S.sel?'on':''}" onclick="selectPart('${p.id}')">
      <span class="li2">${ti.i}</span>
      <span class="lname">${esc(label)}</span>
      ${(isPV||isSP)?`<button class="lbtn" style="color:${expanded?'var(--pri)':''};font-weight:700;" onclick="event.stopPropagation();toggleLayerExpand('${p.id}')">${expanded?'▾':'▸'}</button>`:''}
      <button class="lbtn" onclick="event.stopPropagation();moveLayerUp('${p.id}')">↑</button>
      <button class="lbtn" onclick="event.stopPropagation();moveLayerDown('${p.id}')">↓</button>
      <button class="lbtn ${p.locked?'on':''}" onclick="event.stopPropagation();toggleLock('${p.id}')\">${p.locked?'🔒':'🔓'}</button>
    </div>`;
    if(expanded&&isPV){
      h+=`<div class="lsub">`+(p.pages||[]).map((pg,i)=>
        `<div class="lsub-item ${p.cur===i?'on':''}" onclick="enterPageEdit('${p.id}',${i})">
          <span class="lnum">#${i+1}</span>
          <span style="flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${esc(pg.name||'页面 '+(i+1))}</span>
          <span class="lcount">${(pg.parts||[]).length} 组件</span>
        </div>`
      ).join('')+`</div>`;
    }
    if(expanded&&isSP){
      h+=`<div class="lsub"><div class="lsub-item" onclick="enterScrollEdit('${p.id}')">
        <span class="lnum">📜</span>
        <span style="flex:1;">进入内容编辑</span>
        <span class="lcount">${(p.parts||[]).length} 组件</span>
      </div></div>`;
    }
    return h;
  }).join('');
  if((S.connections||[]).length){
    html+=`<div style="font-size:12px;font-weight:600;padding:12px 4px 6px;color:var(--on-sur-v);">🔗 连接 (${S.connections.length})</div>`;
    S.connections.forEach(c=>{
      const fromL=getPartLabel(c.from),toL=getPartLabel(c.to);
      html+=`<div class="litem link-item" onclick="editConnection('${c.id}')">
        <span class="li2">🔗</span>
        <span class="lname" title="${esc(c.note)}">${esc(fromL)} → ${esc(toL)}</span>
        <button class="lbtn" onclick="event.stopPropagation();deleteConnection('${c.id}')">✕</button>
      </div>`;
      if(c.note){
        html+=`<div style="font-size:11px;color:var(--on-sur-v);padding:0 10px 6px 40px;
          overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${esc(c.note)}</div>`;
      }
    });
  }
  el.innerHTML=html;
}
function toggleLayerExpand(id){
  if(S.layerExpanded.has(id))S.layerExpanded.delete(id);
  else S.layerExpanded.add(id);
  renderLayers();
}
function moveLayerUp(id){
  const parts=getEditParts();if(!parts)return;
  const i=parts.findIndex(x=>x.id===id);
  if(i<0||i>=parts.length-1)return;
  [parts[i],parts[i+1]]=[parts[i+1],parts[i]];
  saveHist();renderAll();
}
function moveLayerDown(id){
  const parts=getEditParts();if(!parts)return;
  const i=parts.findIndex(x=>x.id===id);
  if(i<=0)return;
  [parts[i],parts[i-1]]=[parts[i-1],parts[i]];
  saveHist();renderAll();
}

function renderAddPanel(filter){
  const body=document.getElementById('addBody');
  const titleEl=document.getElementById('addPanelTitle');
  if(!body)return;
  if(S.editingPage){
    const owner=byId(S.editingPage.pagerId);
    let nm='';
    if(owner&&owner.type==='fold-list'){
      const it=(owner.items||[])[S.editingPage.itemIdx];
      nm=it?.title||'列表项';
    }else{
      const pg=(owner?.pages||[])[S.editingPage.pageIdx];
      nm=pg?.name||'页面';
    }
    titleEl.textContent='添加组件 · '+nm;
  }else{
    titleEl.textContent='添加组件';
  }
  const f=(filter||'').trim().toLowerCase();
  const groups={};
  TYPES.forEach(t=>{(groups[t.g]=groups[t.g]||[]).push(t);});
  const catOrder=['按钮','输入','展示','媒体','导航','容器'];
  const cats=catOrder.filter(c=>groups[c]);
  let html='';

    const matched=TYPES.filter(x=>{
      const name=(x.n||'').toLowerCase();
      const type=(x.t||'').toLowerCase();

      return name.includes(f)||type.includes(f)||g.includes(f);
    });

      html=`<div style="font-size:11px;color:var(--on-sur-v);padding:4px 4px 8px;">找到 ${matched.length} 个组件</div>
        <div class="acc-items">${matched.map(x=>addItemHTML(x)).join('')}</div>`;
    }else{
      html=`<div class="sb-empty">没有匹配 "<b>${esc(f)}</b>"</div>`;
    }
  }else{
    html=cats.map(c=>`
  <div class="acc-group" data-cat="${c}">
    <div class="acc-head" onclick="toggleAccGroup('${c}')">
      <span class="ahi">•</span>
      <span class="aht">${c}</span>
      <span class="aha">›</span>
    </div>
    <div class="acc-body">
      <div class="acc-items">${groups[c].map(x=>addItemHTML(x)).join('')}</div>
    </div>
  </div>`).join('');
  }
  body.innerHTML=html;
}

/* ★ 添加面板：按钮类显示真实预览样式 + 样式切换 */
function addItemHTML(x){
  let preview='';
  if(x.t==='button'){
    const v=(S.btnDefaults&&S.btnDefaults.variant)||'';
    preview=`<span class="mini-btn ${v}">${esc((S.btnDefaults&&S.btnDefaults.text)||'按钮')}</span>`;
  }else if(x.t==='icon-btn'){
    preview=`<span class="mini-icon-btn">${(S.btnDefaults&&S.btnDefaults.iconBtn)||'★'}</span>`;
  }else if(x.t==='fab'){
    preview=`<span class="mini-fab">${(S.btnDefaults&&S.btnDefaults.fab)||'✚'}</span>`;
  }else if(x.t==='chip'){

async function applyTemplate(key){

  const s=scr();if(!s)return;
  if(S.editingPage){alert('请先退出页面编辑');return;}
  if(s.parts.length){

    if(!ok)return;
  }
  s.parts=[];
  S.connections=[];
  const pagerIds={};
  const tempParts=[];
  tpl.parts.forEach(t=>{
    const info=TYPES.find(x=>x.t===t.t);
    const np=Object.assign({
      id:uid(),type:t.t,x:t.x,y:t.y,w:t.w,h:t.h,
      material:'none',jump:'',anim:'slide-left',
      locked:false,hidden:false,group:null,
      glassBlur:null,glassOpacity:null,
    },JSON.parse(JSON.stringify(t.d||info?.d||{})));
    if(np.type==='pageview'&&np.pages){
      np.pages.forEach(pg=>{
        if(pg.parts){
          pg.parts.forEach(sp=>{sp.id=uid();});
        }
      });
    }
    tempParts.push(np);
    if(np.type==='pageview'&&!pagerIds._pager){
      pagerIds._pager=np.id;
    }
  });
  tempParts.forEach(np=>{
    if(np.navLinks){
      np.navLinks=np.navLinks.map(l=>{
        if(l&&l.startsWith('_pager:'))return pagerIds._pager+':'+l.split(':')[1];
        return l;
      });
    }
  });
  s.parts=tempParts;
  s.name=tpl.name;
  saveHist();closeAllPanels();renderAll();
}

/* 扫描工程内所有组件 id（含嵌套 fold-list / pageview），返回最大编号+1，避免导入后 id 冲突 */
function computeMaxNid(){
  let max=0;
  const scanParts=(parts)=>{
    (parts||[]).forEach(p=>{
      const n=parseInt(String(p.id||'').replace(/^p/,''),10);
      if(!isNaN(n)&&n>max)max=n;
      if(p.type==='fold-list')(p.items||[]).forEach(it=>scanParts(it.parts));
      if(p.type==='pageview')(p.pages||[]).forEach(pg=>scanParts(pg.parts));
    });
  };
  (S.screens||[]).forEach(s=>scanParts(s.parts));
  return max+1;
}
function importJSON(){
  const input=document.createElement('input');input.type='file';input.accept='.json,application/json';
  input.onchange=e=>{
    const f=e.target.files[0];if(!f)return;
    const reader=new FileReader();
    reader.onload=ev=>{
      try{
        const d=JSON.parse(ev.result||ev.target.result);
        if(!d.screens||!Array.isArray(d.screens)||!d.screens.length)throw new Error('格式错误：缺少 screens');
        // 规范化每个屏幕
        S.screens=d.screens;
        S.screens.forEach(s=>{
          if(!s.id)s.id='s'+Math.random().toString(36).slice(2,8);
          if(!s.parts)s.parts=[];
          if(s.sel===undefined)s.sel=null;
        });
        // 恢复设置（缺省时用安全默认值，兼容旧存档）
        if(d.shape)S.shape=d.shape;
        if(d.color)S.color=d.color;
        if(d.font)S.font=d.font;
        if(d.screenSize&&SIZE_MAP[d.screenSize])S.screenSize=d.screenSize;
        if(typeof d.gridSize==='number')S.gridSize=d.gridSize;
        if(typeof d.snapStrength==='number')S.snapStrength=d.snapStrength;
        if(d.linkNoteMode)S.linkNoteMode=d.linkNoteMode;
        if(Array.isArray(d.connections))S.connections=d.connections;
        else S.connections=[];
        if(Array.isArray(d.resources))S.resources=d.resources;
        // 视频/图片资源等无需处理
        // 关键：恢复 nid；缺失或过小时用全工程最大编号兜底，避免新组件 id 冲突
        const maxNid=computeMaxNid();
        S.nid=(typeof d.nid==='number'&&d.nid>=maxNid)?d.nid:maxNid;
        // 恢复当前屏幕（找不到则回退第一屏）
        S.cur=(d.cur&&S.screens.some(x=>x.id===d.cur))?d.cur:S.screens[0].id;
        S.sel=null;
        if(S.editingPage)exitPageEdit();
        // 重置历史，避免撤销穿越导入
        S.hist=[];S.hi=-1;
        renderAll();
        if(d.canvasBg==='colorful'){
          const c=document.getElementById('canvas');
          if(c)c.classList.add('has-bg');
          const cb=document.getElementById('canvasBg2');
          if(cb)cb.value='colorful';
        }else{
          const c=document.getElementById('canvas');
          if(c)c.classList.remove('has-bg');
          const cb=document.getElementById('canvasBg2');
          if(cb)cb.value='plain';
        }
        // 同步设置面板控件
        const g2=document.getElementById('gridSize2');if(g2)g2.value=S.gridSize;
        setSnapStrength(snapLevelFromPx(S.snapStrength));
        const ss2=document.getElementById('screenSize2');if(ss2)ss2.value=S.screenSize;
        applyTheme&&applyTheme(S.color,true);
        applyFont&&applyFont(S.font,true);
        saveHist();
        alert('导入成功');
      }catch(err){alert('导入失败：'+err.message);}
    };
    reader.readAsText(f);
  };
  input.click();
}

function onTS(e){
  if(S.linkMode){
    e.stopPropagation();e.preventDefault();
    const partEl=e.target.closest('.part');
    if(partEl)handleLinkClick(partEl.dataset.id);
    return;
  }
  if(S.preview){
    const tag=e.target.tagName;
    if(tag==='INPUT'||tag==='TEXTAREA'||tag==='SELECT') return;
    if(e.target.closest('input,textarea')) return;
    if(e.target.closest('[data-navbar]')) return;   // 导航栏按钮走自身 onclick
    // 滚动页面内的子组件：可交互（走组件自身行为），但不阻断原生滚动
    const inScroll=e.target.closest('.sp-scroll');
    const subPart=e.target.closest('.part');
    if(inScroll){
      if(subPart)onPreviewTap(subPart.dataset.id,e);
      return; // 允许原生纵向滚动
    }
    if(e.target.closest(PREVIEW_INTERACTIVE_SEL)) return;
    e.preventDefault();
    if(subPart)onPreviewTap(subPart.dataset.id,e);
    return;
  }
  if(e.target.isContentEditable)return;
  if(S.inlineEditing)return;   // 内联编辑中：不触发拖动/选中
  if(e.target.closest('.nav,.dot,.fl-head'))return;
  // 滚动页面内部：允许原生纵向滚动，不触发组件拖动（内部子组件仍可拖动）
  if(e.target.closest('.sp-scroll')&&!e.target.closest('.part[data-scrollpage] .part')){
    selectPart(e.currentTarget.dataset.id);return;
  }
  e.stopPropagation();

  const p=parts.find(x=>x.id===id);if(!p)return;
  if(S.multiMode){e.preventDefault();toggleMultiSelect(id);return;}
  const now=Date.now();
  if(now-drag.lastTap<340&&drag.lastTapId===id){
    e.preventDefault();startInlineEdit(id,e.target);
    drag.lastTap=0;drag.lastTapId=null;return;
  }
  drag.lastTap=now;drag.lastTapId=id;

  drag.ox=p.x;drag.oy=p.y;drag.moved=false;drag.longT=null;

function onMove(px,py){
  if(!drag.on)return;
  const dx=px-drag.sx,dy=py-drag.sy;
  if(!drag.moved&&Math.abs(dx)+Math.abs(dy)>4){
    drag.moved=true;clearTimeout(drag.longT);
    document.querySelectorAll('.part.press').forEach(el=>el.classList.remove('press'));
    document.querySelector(`.part[data-id="${drag.id}"]`)?.classList.add('drag');
  }
  if(!drag.moved)return;
  const parts=getEditParts();if(!parts)return;
  const p=parts.find(x=>x.id===drag.id);if(!p)return;
  const cw=getCanvasSize().w,ch=getCanvasSize().h;
  let nx=drag.ox+dx,ny=drag.oy+dy;
  nx=Math.max(0,Math.min(cw-p.w,nx));
  ny=Math.max(0,Math.min(ch-p.h,ny));
  const sn=computeSnap(p,nx,ny,cw,ch,parts);
  if(sn.x!==null){nx=sn.x;showGuide('v',sn.gx);}else hideGuide('v');
  if(sn.y!==null){ny=sn.y;showGuide('h',sn.gy);}else hideGuide('h');
  const ddx=nx-p.x,ddy=ny-p.y;
  const group=(p.group)?parts.filter(x=>x.group===p.group&&x.id!==p.id):[];
  group.forEach(g=>{
    g.x=Math.max(0,Math.min(cw-g.w,g.x+ddx));
    g.y=Math.max(0,Math.min(ch-g.h,g.y+ddy));
    const gel=document.querySelector(`.part[data-id="${g.id}"]`);
    if(gel){gel.style.left=g.x+'px';gel.style.top=g.y+'px';}
  });
  p.x=nx;p.y=ny;
  const el=document.querySelector(`.part[data-id="${p.id}"]`);
  if(el){el.style.left=p.x+'px';el.style.top=p.y+'px';}
  updateFloatBar();
  updateLinkLayer();
}
function computeSnap(p,nx,ny,cw,ch,parts){
  const TH=(S.snapStrength==null?7:S.snapStrength);
  if(TH<=0)return {x:null,y:null,gx:0,gy:0};   // 开放档：不吸附，随意放置
  const others=(parts||[]).filter(x=>x.id!==p.id&&!(p.group!=null&&x.group===p.group));
  const xs=[nx,nx+p.w/2,nx+p.w],ys=[ny,ny+p.h/2,ny+p.h];
  const tx=[0,cw/2,cw],ty=[0,ch/2,ch];
  others.forEach(o=>{tx.push(o.x,o.x+o.w/2,o.x+o.w);ty.push(o.y,o.y+o.h/2,o.y+o.h);});
  let bestX=null,bdX=TH,gx=0;
  xs.forEach(v=>{tx.forEach(t=>{const d=Math.abs(v-t);if(d<bdX){bdX=d;bestX=nx+(t-v);gx=t;}});});
  let bestY=null,bdY=TH,gy=0;
  ys.forEach(v=>{ty.forEach(t=>{const d=Math.abs(v-t);if(d<bdY){bdY=d;bestY=ny+(t-v);gy=t;}});});
  return {x:bestX,y:bestY,gx,gy};
}
function showGuide(dir,pos){const el=document.getElementById(dir==='v'?'guideV':'guideH');if(!el)return;el.classList.add('on');if(dir==='v')el.style.left=pos+'px';else el.style.top=pos+'px';}
function hideGuide(dir){const el=document.getElementById(dir==='v'?'guideV':'guideH');if(el)el.classList.remove('on');}

function endDrag(){
  if(!drag.on)return;

function startInlineEdit(id,targetEl){
  if(S.preview||S.linkMode)return;
  const parts=getEditParts();if(!parts)return;
  const p=parts.find(x=>x.id===id);if(!p)return;
  const container=document.querySelector(`.part[data-id="${id}"]`);if(!container)return;
  let fieldEl=null,el=targetEl;
  while(el&&el!==container){
    if(el.dataset&&el.dataset.field){fieldEl=el;break;}
    el=el.parentElement;
  }
  if(!fieldEl)fieldEl=container.querySelector('[data-field]');
  if(!fieldEl){openProp(id);return;}
  drag.on=false;clearTimeout(drag.longT);drag.moved=false;
  const field=fieldEl.dataset.field,origText=p[field]||'';
  S.inlineEditing={id,el:fieldEl};
  fieldEl.setAttribute('contenteditable','true');
  // 编辑期间禁止元素平移/缩放等变换，避免 WebView 重排导致失焦
  fieldEl.style.transform='none';
  // 记录实时内容，避免依赖 blur 才提交
  let cur=origText;
  const commit=()=>{
    const t=(fieldEl.textContent||'').trim();
    if(t!==origText){p[field]=t;}
  };
  const finish=()=>{
    if(fieldEl.getAttribute('contenteditable')!=='true')return;
    S.inlineEditing=null;
    fieldEl.removeAttribute('contenteditable');
    commit();
    saveHist();
    renderCanvas();renderLayers();
  };
  // 输入时只暂存，不做任何 DOM 重建（防止输入法被顶掉）
  fieldEl.addEventListener('input',()=>{cur=fieldEl.textContent;});
  fieldEl.addEventListener('blur',finish,{once:true});
  fieldEl.addEventListener('keydown',ev=>{
    if(ev.key==='Enter'&&!ev.shiftKey){ev.preventDefault();fieldEl.blur();}
    if(ev.key==='Escape'){ev.preventDefault();fieldEl.textContent=origText;fieldEl.blur();}
  });
  // 编辑期间：不让画布拖动/选中逻辑干扰输入
  fieldEl.addEventListener('touchstart',ev=>ev.stopPropagation(),{passive:true});
  fieldEl.addEventListener('mousedown',ev=>ev.stopPropagation());
  fieldEl.addEventListener('click',ev=>ev.stopPropagation());
  fieldEl.focus();
  // 把光标/选区放到文字上，方便直接改写
  try{
    const range=document.createRange();range.selectNodeContents(fieldEl);
    const sel=window.getSelection();sel.removeAllRanges();sel.addRange(range);
  }catch(e){}
}

function slideToScreen(id,anim){
  const target=S.screens.find(s=>s.id===id);if(!target)return;
  if(!anim||anim==='none'){S.cur=target.id;renderCanvas();return;}
  const cls='anim-'+anim;
  // 先切屏渲染新内容，再让"屏幕内容层"从目标方向滑入（导航栏固定在层外，不受影响）
  S.cur=target.id;renderCanvas();
  const layer=document.getElementById('screenLayer');
  if(!layer)return;
  layer.classList.remove('anim-slide-left','anim-slide-right','anim-fade','anim-scale');
  void layer.offsetWidth;
  layer.classList.add(cls);
  setTimeout(()=>{layer.classList.remove(cls);},360);
}

/* ★ 预览模式点击：优先执行连线动作，其次执行组件自身行为 */
function onPreviewTap(id,e){
  const parts=getEditParts();if(!parts)return;
  const conns=(S.connections||[]).filter(c=>c.from===id);
  if(conns.length&&!(e&&e.target.closest('[data-navbar],[data-navbar-mirror]'))){
    conns.forEach(c=>{
      const target=parts.find(x=>x.id===c.to);
      if(!target)return;
      if(c.action==='toggle'){
        target.hidden=!target.hidden;
        const el=document.querySelector(`.part[data-id="${target.id}"]`);
        if(el){
          el.style.display=target.hidden?'none':'';
        }
      }
    });
    return;
  }
  // 导航栏：按点到的具体按钮跳转
  const navHost=e&&e.target.closest('[data-navbar],[data-navbar-mirror]');
  const navId=navHost?(navHost.getAttribute('data-navbar-mirror')||navHost.dataset.id):null;
  if(navId||(parts.find(x=>x.id===id)||{}).type==='navbar'){
    const p=byIdAny(navId||id);if(!p)return;
    let idx=p.cur;
    const btn=e&&e.target.closest('.m3nav-item');
    if(btn&&btn.dataset.idx!=null)idx=+btn.dataset.idx;
    const it=(p.items||[])[idx];if(!it)return;
    p.cur=idx;
    if(S.preview){renderCanvas();}
    if(it.screenId&&S.screens.some(s=>s.id===it.screenId)){
      slideToScreen(it.screenId,it.anim||'slide-left');
    }
    return;
  }
  const p=parts.find(x=>x.id===id);
  if(!p)return;
  if(['button','card','image','icon-btn','fab','chip','list-item'].includes(p.type)){
    if(p.toggle&&p.type==='button'){
      p.on=!p.on;
      const el=document.querySelector(`.part[data-id="${id}"]`);
      if(el)el.classList.toggle('on',p.on);
      return;
    }
    if(p.jump)slideToScreen(p.jump,p.anim||'slide-left');
  }
}

function selectPart(id){
  if(S.preview||S.linkMode)return;
  S.sel=id;
  document.querySelectorAll('.part').forEach(el=>el.classList.toggle('sel',el.dataset.id===id));
  // 固定层导航栏的选中态

/* 轻提示（底部浮出，1.6s 自动消失） */
function toast(msg){
  let t=document.getElementById('appToast');
  if(!t){
    t=document.createElement('div');
    t.id='appToast';
    t.className='app-toast';
    document.body.appendChild(t);
  }
  t.textContent=msg;
  t.classList.add('on');
  clearTimeout(t._tm);
  t._tm=setTimeout(()=>t.classList.remove('on'),1600);
}
/* 批量复制：把选中的组件放进剪贴板（不立即生成副本），可切屏后长按粘贴 */
function multiCopy(){
  if(!S.multiSel.length)return;
  const parts=getEditParts();if(!parts)return;
  const list=S.multiSel.map(id=>parts.find(x=>x.id===id)).filter(Boolean);
  if(!list.length)return;
  S.clipMulti=list.map(p=>JSON.parse(JSON.stringify(p)));
  // 相对坐标归一：以被复制集合的左上角为基准，粘贴时保持相对布局
  const minX=Math.min(...S.clipMulti.map(p=>p.x));
  const minY=Math.min(...S.clipMulti.map(p=>p.y));
  S.clipMulti.forEach(p=>{p._rx=p.x-minX;p._ry=p.y-minY;});
  persist();
  toggleMultiMode();
  toast&&toast(`已复制 ${list.length} 个组件 · 切到目标屏长按粘贴`);
}
/* 批量粘贴：在当前位置一次性粘出整组组件（只执行一次，粘完清空剪贴板） */
function pasteMulti(){
  const clip=S.clipMulti;
  if(!clip||!clip.length)return false;
  const parts=getEditParts();if(!parts)return false;
  const sz=getCanvasSize();
  // 落点：画布中心
  const w=Math.max(...clip.map(p=>p._rx+p.w));
  const h=Math.max(...clip.map(p=>p._ry+p.h));
  const ox=Math.max(8,Math.round((sz.w-w)/2));
  const oy=Math.max(8,Math.round((sz.h-h)/2));
  const newIds=[];
  clip.forEach(src=>{
    const np=JSON.parse(JSON.stringify(src));
    delete np._rx;delete np._ry;
    np.id=uid();
    np.x=ox+(src._rx||0);
    np.y=oy+(src._ry||0);
    parts.push(np);
    newIds.push(np.id);
  });
  S.sel=newIds.length===1?newIds[0]:null;
  if(S.editingPage){
    const pager=byId(S.editingPage.pagerId);
    if(pager)pager.sel=S.sel;
  }else{
    const s=scr();if(s)s.sel=S.sel;
  }
  S.clipMulti=null;          // 只粘贴一次
  persist();
  saveHist();renderAll();
  return true;
}

function alignPart(dir){
  const parts=getEditParts();if(!parts)return;
  const p=parts.find(x=>x.id===S.sel);if(!p)return;
  const cw=getCanvasSize().w,ch=getCanvasSize().h;
  if(dir==='h')p.x=Math.round((cw-p.w)/2);
  else if(dir==='v')p.y=Math.round((ch-p.h)/2);
  else if(dir==='l')p.x=0;
  else if(dir==='r')p.x=cw-p.w;
  else if(dir==='t')p.y=0;
  else if(dir==='b')p.y=ch-p.h;
  updatePartEl(p);saveHist();updateLinkLayer();
}
function toggleLock(id){
  const parts=getEditParts();if(!parts)return;
  const p=parts.find(x=>x.id===id);if(!p)return;
  p.locked=!p.locked;
  updatePartEl(p);saveHist();renderLayers();
}
function toggleHide(id){
  const parts=getEditParts();if(!parts)return;
  const p=parts.find(x=>x.id===id);if(!p)return;
  p.hidden=!p.hidden;
  updatePartEl(p);saveHist();renderLayers();
}
function tidy(){
  const parts=getEditParts();if(!parts)return;
  const cw=getCanvasSize().w,M=16;
  const sorted=[...parts].sort((a,b)=>a.y-b.y);
  let cy=M;
  sorted.forEach(p=>{
    if(p.w<100&&p.h<60)p.x=cw-p.w-M;else p.x=M;
    p.y=cy;cy+=p.h+8;
  });
  renderCanvas();saveHist();
}

let ctxId=null;
function openCtx(id){

function ctxDo(action){
  document.getElementById('ctxMenu').classList.remove('open');
  if(!ctxId)return;
  S.sel=ctxId;const id=ctxId;
  setTimeout(()=>{
    if(action==='del')deletePart();
    else if(action==='copy')copyPart();
    else if(action==='pasteMulti')pasteMulti();
    else if(action==='front')bringFront();
    else if(action==='back')sendBack();
    else if(action==='prop')openProp(id);
    else if(action==='lock')toggleLock(id);
    else if(action==='hide')toggleHide(id);
    else if(action==='copyStyle')copyStyle(id);
    else if(action==='pasteStyle')pasteStyle(id);
    else if(action==='edit'){
      const el=document.querySelector(`.part[data-id="${id}"]`);
      const f=el?.querySelector('[data-field]');
      startInlineEdit(id,f||el);
    }

function addPart(type){
  const info=TYPES.find(x=>x.t===type);
  // 滑动导航栏：作为一个普通组件加入当前屏
  if(info&&info.special==='navbar'){
    const parts=getEditParts();
    if(!parts){alert('请先选择要添加的位置');return;}
    const p=makeNavbarPart();
    parts.push(p);
    S.sel=p.id;
    saveHist();renderAll();persist();
    setTimeout(()=>openNavbarProps(),60);
    return;
  }
  // 标题：作为可多屏同步的顶部组件加入
  if(info&&info.special==='title'){
    const parts=getEditParts();
    if(!parts){alert('请先选择要添加的位置');return;}
    const p=makeTitlePart();
    parts.push(p);
    S.sel=p.id;
    saveHist();renderAll();persist();
    setTimeout(()=>openTitleProps(),60);
    return;
  }
  // 滚动页面：单页可纵向滚动的容器（可编辑内部组件）
  if(info&&info.special==='scrollpage'){
    const parts=getEditParts();
    if(!parts){alert('请先选择要添加的位置');return;}
    const p=makeScrollPagePart();
    parts.push(p);
    S.sel=p.id;
    saveHist();renderAll();persist();
    setTimeout(()=>openScrollPageProps(),60);
    return;
  }
  const parts=getEditParts();if(!parts)return;
  if(!info)return;
  const sz=getCanvasSize();
  const p=Object.assign({
    id:uid(),type,x:0,y:0,w:info.w,h:info.h,
    variant:'',jump:'',anim:'slide-left',material:'none',
    glassBlur:null,glassOpacity:null,
    locked:false,hidden:false,group:null,
  },JSON.parse(JSON.stringify(info.d||{})));
  if(type==='button'&&S.btnDefaults)p.variant=S.btnDefaults.variant;
  p.x=Math.round((sz.w-p.w)/2);
  p.y=Math.min(sz.h-p.h,70+parts.length*62);
  parts.push(p);
  S.sel=p.id;
  if(S.editingPage){
    const pager=byId(S.editingPage.pagerId);
    if(pager)pager.sel=p.id;
  }else{
    const s=scr();if(s)s.sel=p.id;
  }
  saveHist();closeAllPanels();renderCanvas();renderLayers();
  openProp(p.id);
}
function deletePart(){
  const parts=getEditParts();if(!parts||!S.sel)return;
  const i=parts.findIndex(p=>p.id===S.sel);
  if(i<0)return;
  const deletedId=S.sel;
  parts.splice(i,1);
  S.connections=(S.connections||[]).filter(c=>c.from!==deletedId&&c.to!==deletedId);
  S.sel=null;
  if(S.editingPage){
    const pager=byId(S.editingPage.pagerId);
    if(pager)pager.sel=null;
  }else{
    const s=scr();if(s)s.sel=null;
  }
  saveHist();closeAllPanels();renderAll();
}
function copyPart(){
  const parts=getEditParts();if(!parts)return;
  const p=parts.find(x=>x.id===S.sel);if(!p)return;
  const np=JSON.parse(JSON.stringify(p));np.id=uid();
  np.x=Math.min(getCanvasSize().w-np.w,p.x+16);
  np.y=p.y+16;
  parts.push(np);
  S.sel=np.id;
  if(S.editingPage){
    const pager=byId(S.editingPage.pagerId);
    if(pager)pager.sel=np.id;
  }else{
    const s=scr();if(s)s.sel=np.id;
  }
  saveHist();renderAll();
}
function bringFront(){
  const parts=getEditParts();if(!parts)return;
  const p=parts.find(x=>x.id===S.sel);if(!p)return;
  const filtered=parts.filter(x=>x.id!==p.id);filtered.push(p);
  parts.length=0;filtered.forEach(x=>parts.push(x));
  saveHist();renderAll();
}
function sendBack(){
  const parts=getEditParts();if(!parts)return;
  const p=parts.find(x=>x.id===S.sel);if(!p)return;
  const filtered=parts.filter(x=>x.id!==p.id);filtered.unshift(p);
  parts.length=0;filtered.forEach(x=>parts.push(x));
  saveHist();renderAll();
}

function renderIconPicker(current,onPick){
  const cats=Object.keys(ICON_LIB);
  let html=`<input class="icon-search" placeholder="搜索图标…" oninput="filterIcons(this.value)">
    <div class="icon-cats" id="iconCats">${cats.map((c,i)=>`<button class="${i===0?'on':''}" onclick="switchIconCat('${c}',this)">${c}</button>`).join('')}</div>
    <div class="icon-grid" id="iconGrid">${ICON_LIB[cats[0]].map(ic=>`<button class="${current===ic?'on':''}" onclick="_iconPick('${ic.replace(/'/g,"\\'")}')">${ic}</button>`).join('')}</div>`;
  window._iconPick=(ic)=>{onPick(ic);};
  window.switchIconCat=(cat,btn)=>{
    document.querySelectorAll('#iconCats button').forEach(b=>b.classList.toggle('on',b===btn));
    document.getElementById('iconGrid').innerHTML=ICON_LIB[cat].map(ic=>`<button class="${current===ic?'on':''}" onclick="_iconPick('${ic.replace(/'/g,"\\'")}')">${ic}</button>`).join('');
  };
  window.filterIcons=(q)=>{
    q=q.trim();
    if(!q){switchIconCat(cats[0],document.querySelector('#iconCats button'));return;}
    const uniq=[...new Set(Object.values(ICON_LIB).flat())];
    const found=uniq.filter(ic=>ic.includes(q)||q.includes(ic));
    const res=found.length?found:uniq.slice(0,80);
    document.getElementById('iconGrid').innerHTML=res.map(ic=>`<button class="${current===ic?'on':''}" onclick="_iconPick('${ic.replace(/'/g,"\\'")}')">${ic}</button>`).join('');
  };
  return html;
}

  // 该部件相关的连线

    h+=`<div class="fg"><label>相关连线 (${relatedConns.length})</label>`;

  h+=`<div class="fg"><label data-vlabel="圆角：{}px">圆角：${p.radius!=null?p.radius:'默认'}</label>

  h+=`<div class="fg"><label data-vlabel="阴影：{}">阴影：${p.shadow!=null?p.shadow:'默认'}</label>
    <input type="range" min="0" max="30" value="${p.shadow!=null?p.shadow:0}"
      oninput="upProp('shadow',+this.value)">

  h+=`<div class="fg"><label>材质</label>
    <div class="mat-row">
      <button class="mbtn ${(!p.material||p.material==='none')?'on':''}" onclick="changeMaterial('${p.id}','none')">无</button>

  if(p.material&&p.material!=='none'){
    const def=p.material==='glass'?18:14,defO=p.material==='glass'?35:35;
    const bv=p.glassBlur??def,ov=p.glassOpacity??defO;
    h+=`<div class="fg"><label data-vlabel="模糊度：{}px">模糊度：${bv}px</label><input type="range" min="0" max="60" value="${bv}" oninput="upProp('glassBlur',+this.value)"></div>`;
    h+=`<div class="fg"><label data-vlabel="透明度：{}%">透明度：${ov}%</label><input type="range" min="5" max="100" value="${ov}" oninput="upProp('glassOpacity',+this.value)"></div>`;
  }

  h+=`<div class="fg"><label>对齐到画布</label><div class="align-grid">
    <button class="align-btn" onclick="alignPart('h')"><span class="ai">⟷</span>水平居中</button>
    <button class="align-btn" onclick="alignPart('v')"><span class="ai">↕</span>垂直居中</button>

    <button class="align-btn" onclick="alignPart('t')"><span class="ai">⇡</span>上贴边</button>

  if(['button','icon-btn','fab','chip','list-item','card','image'].includes(p.type)){
    const opts=S.screens.map(s=>`<option value="${s.id}" ${p.jump===s.id?'selected':''}>${s.name}</option>`).join('');

    const anims=[['slide-left','左滑'],['slide-right','右滑'],['fade','淡入'],['scale','缩放'],['none','无']];
    h+=`<div class="fg"><label>过渡动画</label><div class="mat-row">
      ${anims.map(([v,n])=>`<button class="mbtn ${p.anim===v?'on':''}" onclick="upProp('anim','${v}')">${n}</button>`).join('')}
    </div></div>`;
  }

  // 位置 / 尺寸：滑条 + 数字微调，最大值动态限制
  const sz2=getCanvasSize();
  const maxX=Math.max(0,sz2.w-p.w);
  const maxY=Math.max(0,sz2.h-p.h);
  h+=`<div class="fg"><label data-vlabel="X：{}px">X：${Math.round(p.x)}px</label>
    <input type="range" min="0" max="${maxX}" value="${Math.round(p.x)}"
      oninput="upProp('x',+this.value)"></div>`;
  h+=`<div class="fg"><label data-vlabel="Y：{}px">Y：${Math.round(p.y)}px</label>
    <input type="range" min="0" max="${maxY}" value="${Math.round(p.y)}"
      oninput="upProp('y',+this.value)"></div>`;
  h+=`<div class="fg"><label>位置微调</label><div class="row">
    <input type="number" value="${Math.round(p.x)}" min="0" max="${maxX}"
      onchange="upProp('x',Math.min(${maxX},Math.max(0,+this.value)))">
    <input type="number" value="${Math.round(p.y)}" min="0" max="${maxY}"
      onchange="upProp('y',Math.min(${maxY},Math.max(0,+this.value)))">
  </div></div>`;
  h+=`<div class="fg"><label data-vlabel="宽：{}px">宽：${Math.round(p.w)}px</label>
    <input type="range" min="20" max="${sz2.w}" value="${Math.round(p.w)}"
      oninput="upProp('w',+this.value)"></div>`;
  h+=`<div class="fg"><label data-vlabel="高：{}px">高：${Math.round(p.h)}px</label>
    <input type="range" min="10" max="${sz2.h}" value="${Math.round(p.h)}"
      oninput="upProp('h',+this.value)"></div>`;
  h+=`<div class="fg"><label>大小微调</label><div class="row">
    <input type="number" value="${Math.round(p.w)}" min="20" max="${sz2.w}"
      onchange="upProp('w',Math.min(${sz2.w},Math.max(20,+this.value)))">
    <input type="number" value="${Math.round(p.h)}" min="10" max="${sz2.h}"
      onchange="upProp('h',Math.min(${sz2.h},Math.max(10,+this.value)))">
  </div></div>`;

  h+=`<div class="acts"><button class="bdel" onclick="deletePart()">删除</button><button class="bok" onclick="closeAllPanels()">完成</button></div>`;
  document.getElementById('propBody').innerHTML=h;
  openSheet('propSheet');
  setTimeout(()=>scrollPartIntoView(id),330);
}
function imgEditor(p){
  const m=p.imgMode||'emoji';
  let h=`<div class="fg"><label>图片来源</label>
    <div class="mat-row">
      <button class="mbtn ${m==='emoji'?'on':''}" onclick="upProp('imgMode','emoji')">Emoji</button>
      <button class="mbtn ${m==='url'?'on':''}" onclick="upProp('imgMode','url')">URL</button>
      <button class="mbtn ${m==='data'?'on':''}" onclick="upProp('imgMode','data')">本地</button>
    </div>`;
  if(m==='emoji')h+=`<div style="display:flex;gap:8px;align-items:center;margin-top:8px;"><span style="font-size:36px;">${p.emoji||'🖼'}</span><button class="mbtn" style="flex:1;" onclick="openIconPicker('${p.id}','emoji')">选择 Emoji</button></div>`;
  else if(m==='url')h+=`<input type="url" value="${esc(p.url||'')}" placeholder="https://..." oninput="upProp('url',this.value)" style="margin-top:8px;margin-bottom:6px;">${p.url?`<div class="img-preview"><img src="${esc(p.url)}" onerror="this.style.display='none'"></div>`:''}`;
  else h+=`<label class="img-upload" for="imgFile_${p.id}" style="margin-top:8px;">📁 点击选择本地图片</label><input type="file" id="imgFile_${p.id}" accept="image/*" style="display:none;" onchange="handleImgUpload(event,'${p.id}')">${p.data?`<div class="img-preview" style="margin-top:10px;"><img src="${p.data}"></div>`:''}`;
  h+=`</div>`;
  return h;
}
function handleImgUpload(e,id){
  const f=e.target.files[0];if(!f)return;
  const reader=new FileReader();
  reader.onload=ev=>{
    const parts=getEditParts();if(!parts)return;
    const p=parts.find(x=>x.id===id);if(!p)return;
    p.imgMode='data';p.data=ev.target.result;
    S.resources.unshift({data:ev.target.result,name:f.name,t:Date.now()});
    if(S.resources.length>30)S.resources.length=30;
    updatePartEl(p,{fade:true});saveHist();openProp(id);
  };
  reader.readAsDataURL(f);
}
function openIconPicker(id,field){
  const parts=getEditParts();if(!parts)return;
  const p=parts.find(x=>x.id===id);if(!p)return;
  const html=renderIconPicker(p[field]||'',(ic)=>{
    p[field]=ic;updatePartEl(p,{fade:true});saveHist();
    setTimeout(()=>openProp(id),50);
  });
  document.getElementById('propTitle').textContent='选择图标';
  document.getElementById('propBody').innerHTML=
    `<div class="fg">${html}</div><div class="acts"><button class="bcancel" onclick="openProp('${id}')">返回</button></div>`;
  openSheet('propSheet');
}
function addSlide(id){const parts=getEditParts();if(!parts)return;const p=parts.find(x=>x.id===id);if(!p)return;if(!p.slides)p.slides=[];const colors=['#FFB4AB','#A5D6A7','#90CAF9','#FFE082','#CE93D8','#80CBC4'];p.slides.push({mode:'emoji',emoji:'🌟',color:colors[p.slides.length%colors.length]});p.cur=p.slides.length-1;updatePartEl(p);saveHist();openProp(id);}
function delSlide(id,i){const parts=getEditParts();if(!parts)return;const p=parts.find(x=>x.id===id);if(!p)return;p.slides.splice(i,1);if(p.cur>=p.slides.length)p.cur=Math.max(0,p.slides.length-1);updatePartEl(p);saveHist();openProp(id);}
function editSlide(id,i){
  const parts=getEditParts();if(!parts)return;
  const p=parts.find(x=>x.id===id);if(!p)return;
  const s=p.slides[i];if(!s)return;
  const m=s.mode||'emoji';
  document.getElementById('propTitle').textContent=`第 ${i+1} 张`;
  let h=`<div class="fg"><label>类型</label>
    <div class="mat-row">
      <button class="mbtn ${m==='emoji'?'on':''}" onclick="_slideMode('${id}',${i},'emoji')">Emoji</button>
      <button class="mbtn ${m==='url'?'on':''}" onclick="_slideMode('${id}',${i},'url')">URL</button>
      <button class="mbtn ${m==='data'?'on':''}" onclick="_slideMode('${id}',${i},'data')">上传</button>
    </div></div>`;
  if(m==='emoji'){
    h+=`<div class="fg"><label>背景色</label><input type="color" value="${s.color||'#FFB4AB'}" onchange="_slideColor('${id}',${i},this.value)"></div>`;
    h+=`<div class="fg"><label>Emoji</label><div style="display:flex;gap:8px;"><span style="font-size:36px;">${s.emoji||'🌟'}</span><button class="mbtn" style="flex:1;" onclick="_slidePickEmoji('${id}',${i})">选择</button></div></div>`;
  }else if(m==='url')h+=`<div class="fg"><label>URL</label><input type="url" value="${esc(s.url||'')}" oninput="_slideUrl('${id}',${i},this.value)"></div>`;
  else h+=`<div class="fg"><label>上传</label><label class="img-upload" for="sf_${id}_${i}">📁 选择图片</label><input type="file" id="sf_${id}_${i}" accept="image/*" style="display:none;" onchange="_slideUpload(event,'${id}',${i})">${s.data?`<div class="img-preview" style="margin-top:10px;"><img src="${s.data}"></div>`:''}</div>`;
  h+=`<div class="acts"><button class="bcancel" onclick="openProp('${id}')">返回</button></div>`;
  document.getElementById('propBody').innerHTML=h;
  openSheet('propSheet');
}
function _slideMode(id,i,m){const parts=getEditParts();const p=parts.find(x=>x.id===id);p.slides[i].mode=m;updatePartEl(p);saveHist();editSlide(id,i);}
function _slideColor(id,i,c){const parts=getEditParts();const p=parts.find(x=>x.id===id);p.slides[i].color=c;updatePartEl(p);saveHist();}
function _slideUrl(id,i,u){const parts=getEditParts();const p=parts.find(x=>x.id===id);p.slides[i].url=u;saveHist();}
function _slideUpload(e,id,i){const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=ev=>{const parts=getEditParts();const p=parts.find(x=>x.id===id);p.slides[i].mode='data';p.slides[i].data=ev.target.result;updatePartEl(p);saveHist();editSlide(id,i);};r.readAsDataURL(f);}
function _slidePickEmoji(id,i){const parts=getEditParts();const p=parts.find(x=>x.id===id);const html=renderIconPicker(p.slides[i].emoji||'🌟',(ic)=>{p.slides[i].emoji=ic;updatePartEl(p);saveHist();setTimeout(()=>editSlide(id,i),50);});document.getElementById('propBody').innerHTML=`<div class="fg">${html}</div><div class="acts"><button class="bcancel" onclick="editSlide('${id}',${i})">返回</button></div>`;openSheet('propSheet');}
function updateNavItems(id,v){const parts=getEditParts();if(!parts)return;const p=parts.find(x=>x.id===id);if(!p)return;p.items=v.split('\n').filter(x=>x.trim()).map(l=>{const a=l.split(',');return [a[0]?.trim()||'●',a[1]?.trim()||'项目'];});updatePartEl(p);saveHist();}
function updateTlItems(id,v){const parts=getEditParts();if(!parts)return;const p=parts.find(x=>x.id===id);if(!p)return;p.items=v.split('\n').filter(x=>x.trim()).map(l=>{const a=l.split('|');return [a[0]?.trim()||'标题',a[1]?.trim()||''];});updatePartEl(p);saveHist();}

function _foldSet(id,i,k,v){

function pvGoDirect(id,i){

function renamePVPage(id,i,name){
  const parts=getEditParts();const p=parts?.find(x=>x.id===id);if(!p)return;
  if(!p.pages[i])return;
  p.pages[i].name=name;
  saveHist();
}
function setPVPageColor(id,i,c){
  const parts=getEditParts();const p=parts?.find(x=>x.id===id);if(!p)return;
  if(!p.pages[i])return;
  p.pages[i].color=c;
  updatePartEl(p);saveHist();
}
function addPVPage(id){
  const parts=getEditParts();const p=parts?.find(x=>x.id===id);if(!p)return;
  if(!p.pages)p.pages=[];
  const colors=['#FFFFFF','#EADDFF','#FFD8E4','#D0FFE0','#FFE0C0','#C5D8FF'];
  p.pages.push({name:'页面 '+(p.pages.length+1),color:colors[p.pages.length%colors.length],parts:[]});
  p.cur=p.pages.length-1;
  updatePartEl(p);saveHist();renderLayers();openProp(id);
}
function delPVPage(id,i){
  const parts=getEditParts();const p=parts?.find(x=>x.id===id);if(!p)return;
  if((p.pages||[]).length<=1){alert('至少保留一页');return;}
  if(!confirm('删除该页面及其中所有组件？'))return;
  p.pages.splice(i,1);
  if(p.cur>=p.pages.length)p.cur=Math.max(0,p.pages.length-1);
  updatePartEl(p);saveHist();renderLayers();openProp(id);
}

function changeMaterial(id,mat){
  const parts=getEditParts();if(!parts)return;
  const p=parts.find(x=>x.id===id);if(!p)return;
  const oldEl=document.querySelector(`.part[data-id="${id}"]`);
  if(!oldEl){p.material=mat;saveHist();openProp(id);return;}
  oldEl.style.transition='opacity .12s ease';oldEl.style.opacity='.3';
  setTimeout(()=>{p.material=mat;updatePartEl(p,{fade:true});saveHist();openProp(id);},110);
}
function upProp(k,v){
  const parts=getEditParts();if(!parts)return;
  const p=parts.find(x=>x.id===S.sel);if(!p)return;
  p[k]=v;
  const fade=(k==='glassBlur'||k==='glassOpacity'||k==='material');
  updatePartEl(p,{fade});
  if(k==='value'||k==='glassBlur'||k==='glassOpacity'
     ||k==='x'||k==='y'||k==='w'||k==='h'||k==='radius'||k==='shadow'){
    document.querySelectorAll('#propBody label[data-vlabel]').forEach(l=>{
      const tpl=l.dataset.vlabel;
      if(tpl.includes('模糊度')&&k==='glassBlur')l.textContent=tpl.replace('{}',v);
      else if(tpl.includes('透明度')&&k==='glassOpacity')l.textContent=tpl.replace('{}',v);
      else if(tpl.includes('数值')&&k==='value')l.textContent=tpl.replace('{}',v);
      else if(tpl.includes('星级')&&k==='value')l.textContent=tpl.replace('{}',v);
      else if(tpl.startsWith('X：')&&k==='x')l.textContent=tpl.replace('{}',v);
      else if(tpl.startsWith('Y：')&&k==='y')l.textContent=tpl.replace('{}',v);
      else if(tpl.startsWith('宽：')&&k==='w')l.textContent=tpl.replace('{}',v);
      else if(tpl.startsWith('高：')&&k==='h')l.textContent=tpl.replace('{}',v);
      else if(tpl.startsWith('圆角：')&&k==='radius')l.textContent=`圆角：${v}px`;
      else if(tpl.startsWith('阴影：')&&k==='shadow')l.textContent=`阴影：${v}`;
    });
  }
  if(k==='material'&&(v==='glass'||v==='liquid')){
    const sel=document.getElementById('canvasBg2');
    if(sel&&sel.value==='plain'){sel.value='colorful';document.getElementById('canvas').classList.add('has-bg');}
  }
  if(k==='imgMode')setTimeout(()=>openProp(p.id),0);
  if(['variant','toggle','on','anim','material','autoplay','colorIdx','cardStyle','textAlign','textVAlign','bgColor','fgColor','borderColor'].includes(k)){
    setTimeout(()=>openProp(p.id),0);
  }
  updateLinkLayer();
  saveHist();
}
function updatePartEl(p,opts){
  if(S.inlineEditing&&S.inlineEditing.id===p.id)return;   // 正在内联编辑，勿重建
  const oldEl=document.querySelector(`.part[data-id="${p.id}"]`);
  if(!oldEl){renderCanvas();return;}
  const wasSel=oldEl.classList.contains('sel');
  const tmp=document.createElement('div');tmp.innerHTML=renderPart(p,S.preview);
  const newEl=tmp.firstElementChild;if(!newEl)return;
  if(wasSel)newEl.classList.add('sel');
  if(opts&&opts.fade){newEl.classList.add('mat-fade-in');setTimeout(()=>newEl.classList.remove('mat-fade-in'),400);}
  oldEl.replaceWith(newEl);
  newEl.setAttribute('tabindex','-1');
  newEl.addEventListener('touchstart',onTS,{passive:false});
  newEl.addEventListener('mousedown',onMD);
  bindCarousels();updateFloatBar();
}
function scrollPartIntoView(id){
  if(!id)return;
  const parts=getEditParts();if(!parts)return;
  const p=parts.find(x=>x.id===id);if(!p)return;
  const stage=document.getElementById('stage');
  const canvas=document.getElementById('canvas');
  const sheet=document.getElementById('propSheet');
  if(!sheet.classList.contains('open'))return;
  const sheetH=sheet.offsetHeight;
  const cRect=canvas.getBoundingClientRect();
  const partTop=cRect.top+p.y*S.zoom,partBottom=partTop+p.h*S.zoom;
  const vTop=100,vBottom=window.innerHeight-sheetH-30;
  if(partTop<vTop)stage.scrollTop-=(vTop-partTop);
  else if(partBottom>vBottom)stage.scrollTop+=(partBottom-vBottom);
}

function switchScr(id){
  if(id===S.cur)return;
  if(S.editingPage){exitPageEdit();}
  if(S.linkMode){S.pendingLink=null;
    document.querySelectorAll('.part').forEach(el=>el.classList.remove('link-pending'));}
  const prev=scr();if(prev)prev.sel=S.sel;
  S.cur=id;const target=scr();S.sel=target?.sel||null;
  closeAllPanels();renderAll();persist();
}
function addScr(){
  if(S.editingPage){exitPageEdit();}
  const n=S.screens.length+1;const id='s'+Date.now();
  const prev=scr();if(prev)prev.sel=S.sel;
  S.screens.push({id,name:'屏幕 '+n,parts:[],sel:null});
  S.cur=id;S.sel=null;saveHist();renderAll();
}

function applyTheme(){setThemeColor(document.getElementById('themeColor').value);}
function setThemeColor(c,silent){
  S.color=c;
  const r=parseInt(c.slice(1,3),16),g=parseInt(c.slice(3,5),16),b=parseInt(c.slice(5,7),16);
  const light=`rgb(${Math.min(255,r+170)},${Math.min(255,g+170)},${Math.min(255,b+170)})`;
  const dark=`rgb(${Math.max(0,r-110)},${Math.max(0,g-110)},${Math.max(0,b-110)})`;
  const root=document.documentElement.style;
  root.setProperty('--pri',c);root.setProperty('--pri-c',light);
  root.setProperty('--on-pri-c',dark);root.setProperty('--sec-c',light);
  const tc=document.getElementById('themeColor');if(tc)tc.value=c;
  document.querySelectorAll('.preset-chip').forEach(el=>el.classList.toggle('on',el.dataset.c===c));
  if(!silent){saveHist();renderCanvas();}
}
function toggleCanvasBg(v){
  if(v===undefined||v===null){
    const el=document.getElementById('canvasBg2');
    v=el?el.value:'plain';
  }
  document.getElementById('canvas').classList.toggle('has-bg',v==='colorful');
  const cb2=document.getElementById('canvasBg2');
  if(cb2)cb2.value=v;
  persist();
}
function setShape(s){
  S.shape=s;
  document.querySelectorAll('#shapeRow .mbtn, #shapeRow2 .mbtn').forEach(b=>
    b.classList.toggle('on',b.dataset.s===s));
  saveHist();renderCanvas();
}
function applyFont(v,silent){
  const f=v||S.font||'Roboto';S.font=f;
  const map={'Roboto':"'Roboto',sans-serif",'Roboto Flex':"'Roboto Flex',sans-serif",'Roboto Serif':"'Roboto Serif',serif",'system':"-apple-system,'PingFang SC',sans-serif"};
  document.documentElement.style.setProperty('--font',map[f]||map['Roboto']);
  const sel=document.getElementById('fontSel2');
  if(sel)sel.value=f;
  if(!silent){saveHist();renderCanvas();}
}

document.addEventListener('touchstart',e=>{
  if(S.preview||S.multiMode||S.linkMode)return;
  if(S.inlineEditing)return;
  if(e.target.closest('.sidebar,.right-panel,.sheet,.multibar,.zoom-ctrl,.fab,.page-edit-bar,.modal,.ctxmenu,.topbar,.tabs,.bottombar,.floatbar,.layers,.stage,.link-tip'))return;
  if(S.sel){
    S.sel=null;
    if(S.editingPage){
      const pager=byId(S.editingPage.pagerId);
      if(pager)pager.sel=null;
    }else{
      const s=scr();if(s)s.sel=null;
    }
    document.querySelectorAll('.part').forEach(el=>el.classList.remove('sel'));
    renderLayers();updateFloatBar();
  }
},true);
document.addEventListener('touchstart',e=>{
  if(S.preview||S.multiMode||S.linkMode)return;
  if(S.inlineEditing)return;
  if(!e.target.closest('.stage'))return;
  if(e.target.closest('.part,.multibar,.zoom-ctrl,.fab,.page-edit-bar,.floatbar,.canvas,.link-tip'))return;
  if(S.sel){
    S.sel=null;
    if(S.editingPage){
      const pager=byId(S.editingPage.pagerId);
      if(pager)pager.sel=null;
    }else{
      const s=scr();if(s)s.sel=null;
    }
    document.querySelectorAll('.part').forEach(el=>el.classList.remove('sel'));
    renderLayers();updateFloatBar();
  }
},true);

/* 空白处长按：若剪贴板有内容则弹出"粘贴"菜单（一次性粘贴整组组件） */
let canvasLongT=null;
document.addEventListener('touchstart',e=>{
  if(S.preview||S.linkMode)return;
  if(S.inlineEditing)return;
  if(!e.target.closest('.stage'))return;
  if(e.target.closest('.part,.sidebar,.sheet,.multibar,.zoom-ctrl,.fab,.page-edit-bar,.floatbar,.layers,.ctxmenu,.topbar,.tabs,.bottombar,.link-tip'))return;
  if(!(S.clipMulti&&S.clipMulti.length))return;
  clearTimeout(canvasLongT);
  const x=e.touches[0].clientX,y=e.touches[0].clientY;
  canvasLongT=setTimeout(()=>{
    if(navigator.vibrate)navigator.vibrate(15);
    if(pasteMulti())toast('已粘贴组件');
  },520);
  const cancel=()=>{clearTimeout(canvasLongT);document.removeEventListener('touchend',cancel);document.removeEventListener('touchmove',cancel);};
  document.addEventListener('touchend',cancel,{once:true});
  document.addEventListener('touchmove',cancel,{once:true});
},true);

function pasteClipboard(){
  if(!S.clipboard)return;
  const parts=getEditParts();if(!parts)return;
  const np=JSON.parse(JSON.stringify(S.clipboard));np.id=uid();
  np.x=Math.min(getCanvasSize().w-np.w,np.x+24);
  np.y=np.y+24;
  parts.push(np);
  S.sel=np.id;
  if(S.editingPage){
    const pager=byId(S.editingPage.pagerId);
    if(pager)pager.sel=np.id;
  }else{
    const s=scr();if(s)s.sel=np.id;
  }
  saveHist();renderAll();
}

function exportPrompt(){
  const s=scr();
  if(!s||s.parts.length===0){alert('请先添加一些组件');return;}
  const lang=document.getElementById('promptLang').value;
  const tpl={
    zh:{intro:'请根据以下设计描述生成一个移动端应用界面。',screen:'屏幕',size:'画布尺寸',color:'主题主色',list:'组件列表',pos:'位置',dim:'尺寸',click:'点击跳转',conn:'连线关系'},
    en:{intro:'Generate a mobile app UI based on the following design.',screen:'Screen',size:'Canvas size',color:'Primary color',list:'Components',pos:'Position',dim:'Size',click:'Navigate to',conn:'Connections'},
    ja:{intro:'以下の設計に基づいてモバイルアプリUIを生成してください。',screen:'画面',size:'キャンバスサイズ',color:'テーマカラー',list:'コンポーネント',pos:'位置',dim:'サイズ',click:'遷移先',conn:'接続関係'},
  };
  const T=tpl[lang]||tpl.zh;
  const sizeStr=SIZE_MAP[S.screenSize];
  let out=T.intro+'\n\n';
  out+=`## ${T.screen}：${s.name}\n`;
  out+=`${T.size}：${sizeStr.w} × ${sizeStr.h}\n`;
  out+=`${T.color}：${S.color}\n\n## ${T.list}\n\n`;
  s.parts.forEach((p,i)=>{
    const ti=TYPES.find(x=>x.t===p.type)||{n:p.type};
    out+=`${i+1}. **${ti.n}**`;
    if(p.text)out+=` — "${p.text}"`;
    if(p.sub)out+=` / "${p.sub}"`;
    if(p.type==='pageview'){
      out+=` (${(p.pages||[]).length} 页：${(p.pages||[]).map(pg=>pg.name).join(' / ')})`;
    }
    out+=`\n   ${T.pos}: (${Math.round(p.x)}, ${Math.round(p.y)})`;
    out+=`\n   ${T.dim}: ${Math.round(p.w)}×${Math.round(p.h)}`;
    if(p.jump){const t=S.screens.find(x=>x.id===p.jump);out+=`\n   ${T.click}: ${t?t.name:''}`;}
    out+='\n\n';
  });
  if((S.connections||[]).length){
    out+=`## ${T.conn}\n\n`;
    S.connections.forEach(c=>{
      out+=`- ${getPartLabel(c.from)} → ${getPartLabel(c.to)}：${c.note}\n`;
    });
    out+='\n';
  }
  out+=`## 要求\n- 适配移动端触摸操作\n- 遵循 Material 3 Expressive\n- 主色 ${S.color}\n`;
  document.getElementById('promptText').textContent=out;
  document.getElementById('promptModal').classList.add('open');
}
function copyPrompt(){
  const t=document.getElementById('promptText').textContent;
  const done=()=>alert('已复制');
  if(navigator.clipboard&&window.isSecureContext)navigator.clipboard.writeText(t).then(done).catch(()=>fb(t,done));
  else fb(t,done);
}
function fb(t,cb){
  const ta=document.createElement('textarea');ta.value=t;ta.style.position='fixed';ta.style.left='-9999px';
  document.body.appendChild(ta);ta.select();
  try{document.execCommand('copy');cb();}catch(e){alert('复制失败');}
  document.body.removeChild(ta);
}

function init(){
  document.getElementById('presetGrid').innerHTML=PRESETS.map(p=>
    `<div class="preset-chip" data-c="${p.c}" title="${p.n}" style="background:${p.c}" onclick="setThemeColor('${p.c}')"></div>`).join('');
  restore();
  document.getElementById('themeColor').value=S.color;
  const r=parseInt(S.color.slice(1,3),16),g=parseInt(S.color.slice(3,5),16),b=parseInt(S.color.slice(5,7),16);
  const root=document.documentElement.style;
  root.setProperty('--pri',S.color);
  root.setProperty('--pri-c',`rgb(${Math.min(255,r+170)},${Math.min(255,g+170)},${Math.min(255,b+170)})`);
  root.setProperty('--on-pri-c',`rgb(${Math.max(0,r-110)},${Math.max(0,g-110)},${Math.max(0,b-110)})`);
  root.setProperty('--sec-c',`rgb(${Math.min(255,r+170)},${Math.min(255,g+170)},${Math.min(255,b+170)})`);
  document.getElementById('fontSel2').value=S.font;
  document.getElementById('gridSize2').value=S.gridSize;
  setSnapStrength(snapLevelFromPx(S.snapStrength));
  document.getElementById('screenSize2').value=S.screenSize;
  document.querySelectorAll('#shapeRow2 .mbtn').forEach(b=>b.classList.toggle('on',b.dataset.s===S.shape));
  document.querySelectorAll('.preset-chip').forEach(el=>el.classList.toggle('on',el.dataset.c===S.color));
  const cb2=document.getElementById('canvasBg2');
  if(cb2)cb2.value=document.getElementById('canvas').classList.contains('has-bg')?'colorful':'plain';
  const lnm=document.getElementById('linkNoteMode');
  if(lnm)lnm.value=S.linkNoteMode||'full';
  const lnl=document.getElementById('linkNoteLimit');
  if(lnl)lnl.value=S.linkNoteLimit||20;
  applyScreenSize();
  setGridSize(S.gridSize);
  renderSidebar();saveHist();renderAll();
}
init();
